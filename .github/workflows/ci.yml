# Builds the package for iOS and validates the podspec on every push and tag.
# A release needs no upload: pushing a version tag such as 1.0.0 publishes it
# to Swift Package Manager and to CocoaPods users who install from the Git tag.
name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS
        run: |
          xcodebuild build \
            -scheme AlgorithmXSDK \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Test event request contract
        run: |
          simulator=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["name"].startswith("iPhone")))')
          xcodebuild test -scheme AlgorithmXSDK \
            -destination "platform=iOS Simulator,id=$simulator" -quiet

      - name: Lint podspec
        run: pod lib lint AlgorithmXSDK.podspec --allow-warnings

      - name: Check podspec version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(ruby -e "puts Pod::Specification.from_file('AlgorithmXSDK.podspec').version" -r cocoapods)
          test "$version" = "${GITHUB_REF_NAME}" || { echo "Podspec version $version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
